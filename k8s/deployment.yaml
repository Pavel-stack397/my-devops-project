apiVersion: apps/v1
kind: Deployment
metadata:
  name: task-api-deployment
spec:
  replicas: 2
  selector:
    matchLabels:
      app: task-api
  template:
    metadata:
      labels:
        app: task-api
    spec:
      containers:
      - name: task-api
        image: YOUR_DOCKERHUB_USERNAME/task-api:latest # Замените!
        ports:
        - containerPort: 5000
